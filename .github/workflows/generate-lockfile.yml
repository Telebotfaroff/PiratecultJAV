name: Generate Package Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-package-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile to main
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: npm did not generate package-lock.json"
            exit 1
          fi

          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo "package-lock.json already exists and is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package lockfile"
          git push origin HEAD:main
